<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA Basics -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <!-- သီးသန့် manifest.json ဖိုင်ကို ချိတ်ဆက်ခြင်း -->
    <link rel="manifest" href="manifest.json">

    <title>Myanmar 2D Live</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #020617; }
        .number-font { font-family: 'Poppins', sans-serif; font-weight: 700; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .text-glow { text-shadow: 0 0 30px rgba(250, 204, 21, 0.7); }
        @keyframes shimmer { 0% { transform: translateX(-150%) skewX(-15deg); } 100% { transform: translateX(150%) skewX(-15deg); } }
        .animate-shimmer { animation: shimmer 2.5s infinite; }
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="antialiased flex justify-center min-h-screen text-slate-200 bg-slate-950">

    <div class="w-full max-w-md bg-gradient-to-b from-slate-900 to-slate-950 overflow-hidden relative flex flex-col h-[100dvh] sm:h-[850px] shadow-[0_0_40px_rgba(0,0,0,0.5)] sm:rounded-[2.5rem] sm:border sm:border-slate-800 sm:my-6">
        
        <main class="flex-1 overflow-y-auto flex flex-col items-center pt-5 pb-24 px-5 space-y-4">
            
            <!-- App Header with Logo -->
            <div class="flex justify-between items-center w-full mb-1">
                <div class="flex items-center space-x-2">
                    <div class="relative flex items-center justify-center w-11 h-11 rounded-[0.8rem] bg-gradient-to-br from-yellow-400 to-orange-500 shadow-[0_0_15px_rgba(250,204,21,0.4)] border-[1.5px] border-yellow-200 overflow-hidden">
                        <div class="absolute inset-0 bg-white/40 w-1/2 animate-shimmer z-0"></div>
                        <span class="text-slate-900 font-black text-[1.2rem] tracking-tighter z-10 relative">2D</span>
                    </div>
                    <h1 class="text-2xl font-bold tracking-wide text-white drop-shadow-md ml-1">Live</h1>
                </div>
                
                <div id="market-status-badge" class="flex items-center space-x-2 bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-full text-[11px] font-semibold border border-emerald-500/30 transition-colors">
                    <div id="market-status-dot" class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                    <span id="market-status-text">ဈေးကွက်ဖွင့်နေပါသည်</span>
                </div>
            </div>

            <!-- Big 2D Result Card -->
            <div class="glass-card w-full rounded-[2rem] relative shadow-lg mt-2">
                <div class="absolute inset-0 rounded-[2rem] overflow-hidden pointer-events-none">
                    <div class="absolute -top-10 -right-10 w-40 h-40 bg-yellow-500/20 rounded-full blur-3xl"></div>
                </div>
                <div class="relative z-10 py-6 flex flex-col items-center justify-center">
                    <div class="flex items-center justify-center w-full min-h-[130px] mb-2">
                        <span class="text-[7.5rem] text-yellow-400 number-font text-glow leading-none flex items-center" id="twod-result">--</span>
                        <i id="result-check" class="fa-solid fa-circle-check text-emerald-500 text-4xl ml-4 hidden drop-shadow-md"></i>
                    </div>
                    <div class="flex items-center space-x-2 text-slate-300 text-[10px] font-medium bg-slate-950/50 px-4 py-2 rounded-full border border-white/5">
                        <i class="fa-solid fa-clock-rotate-left text-yellow-400" id="refresh-icon"></i>
                        <span id="current-time">--/--/---- --:--:-- --</span>
                    </div>
                </div>
            </div>

            <!-- SET and VALUE Boxes -->
            <div class="flex w-full space-x-4">
                <div class="flex-1 glass-card rounded-2xl p-4 flex flex-col items-center shadow-md relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-400 to-blue-600"></div>
                    <span class="text-slate-400 text-[10px] font-bold tracking-wider uppercase mb-1 mt-1">SET Index</span>
                    <span class="text-white text-xl font-bold number-font transition-all duration-300" id="set-index">----.--</span>
                </div>
                <div class="flex-1 glass-card rounded-2xl p-4 flex flex-col items-center shadow-md relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-400 to-purple-600"></div>
                    <span class="text-slate-400 text-[10px] font-bold tracking-wider uppercase mb-1 mt-1">Value</span>
                    <span class="text-white text-xl font-bold number-font transition-all duration-300" id="set-value">-----.--</span>
                </div>
            </div>

            <!-- 12:01 PM and 4:30 PM Blocks -->
            <div class="flex w-full space-x-4">
                <div class="flex-1 bg-gradient-to-b from-slate-800/80 to-slate-900/80 border border-slate-700/50 rounded-2xl overflow-hidden shadow-lg relative">
                    <div class="text-center py-2 bg-slate-800/90 border-b border-slate-700/50 text-[10px] font-semibold text-slate-300 flex items-center justify-center">
                        <i class="fa-regular fa-sun text-yellow-400 mr-1.5"></i> 12:01 PM
                    </div>
                    <div class="py-4 flex justify-center"><span class="text-[2.2rem] text-white font-bold number-font" id="morning-2d">--</span></div>
                    <div class="flex text-slate-400 text-[9px] border-t border-slate-700/50 bg-black/40">
                        <div class="flex-1 text-center py-2 border-r border-slate-700/50" id="morning-set">--</div>
                        <div class="flex-1 text-center py-2" id="morning-val">--</div>
                    </div>
                </div>
                <div class="flex-1 bg-gradient-to-b from-slate-800/80 to-slate-900/80 border border-slate-700/50 rounded-2xl overflow-hidden shadow-lg relative">
                    <div class="text-center py-2 bg-slate-800/90 border-b border-slate-700/50 text-[10px] font-semibold text-slate-300 flex items-center justify-center">
                        <i class="fa-solid fa-moon text-indigo-400 mr-1.5"></i> 4:30 PM
                    </div>
                    <div class="py-4 flex justify-center"><span class="text-[2.2rem] text-white font-bold number-font" id="evening-2d">--</span></div>
                    <div class="flex text-slate-400 text-[9px] border-t border-slate-700/50 bg-black/40">
                        <div class="flex-1 text-center py-2 border-r border-slate-700/50" id="evening-set">--</div>
                        <div class="flex-1 text-center py-2" id="evening-val">--</div>
                    </div>
                </div>
            </div>

            <!-- History List -->
            <div class="w-full mt-2">
                <div class="flex justify-between px-4 pb-2 text-[11px] font-semibold text-slate-400">
                    <div class="w-20"></div><div class="w-14 text-center">Modern</div><div class="w-14 text-center">Internet</div><div class="w-14 text-center">TW</div>
                </div>
                <div class="glass-card rounded-2xl p-4 flex flex-col space-y-3 text-white font-medium text-sm">
                    <div class="flex justify-between items-center border-b border-white/5 pb-3">
                        <div class="w-20 text-slate-400 font-semibold text-[11px]"><i class="fa-regular fa-clock mr-1"></i> 9:30 AM</div>
                        <div class="w-14 text-center" id="mod-930">--</div><div class="w-14 text-center" id="int-930">--</div><div class="w-14 text-center text-yellow-400 font-bold" id="tw-930">--</div>
                    </div>
                    <div class="flex justify-between items-center pt-1">
                        <div class="w-20 text-slate-400 font-semibold text-[11px]"><i class="fa-regular fa-clock mr-1"></i> 2:00 PM</div>
                        <div class="w-14 text-center" id="mod-1400">--</div><div class="w-14 text-center" id="int-1400">--</div><div class="w-14 text-center text-yellow-400 font-bold" id="tw-1400">--</div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Bottom Navigation Bar & Install Button -->
        <footer class="glass-card flex justify-around items-center px-4 py-2 pb-safe absolute bottom-0 w-full z-20 rounded-t-3xl border-t border-white/10 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] h-16">
            <button class="flex flex-col items-center text-yellow-400 group">
                <div class="relative p-1.5 bg-yellow-400/10 rounded-xl transition-all"><i class="fa-solid fa-bolt text-lg"></i></div><span class="text-[9px] font-bold mt-1">2D Live</span>
            </button>
            <button class="flex flex-col items-center text-slate-500 hover:text-white transition-colors">
                <div class="relative p-1.5"><i class="fa-solid fa-cube text-lg"></i></div><span class="text-[9px] font-semibold mt-1">3D</span>
            </button>
            
            <!-- Install App Button (Center) -->
            <button id="install-btn" class="hidden flex-col items-center -mt-6">
                <div class="relative p-3 bg-gradient-to-r from-yellow-400 to-yellow-500 rounded-full shadow-[0_5px_15px_rgba(250,204,21,0.4)] border-2 border-slate-900 text-slate-900 animate-bounce">
                    <i class="fa-solid fa-download text-xl"></i>
                </div>
                <span class="text-[10px] font-bold text-yellow-400 mt-1">Install</span>
            </button>

            <button class="flex flex-col items-center text-slate-500 hover:text-white transition-colors">
                <div class="relative p-1.5"><i class="fa-solid fa-chart-line text-lg"></i></div><span class="text-[9px] font-semibold mt-1">History</span>
            </button>
        </footer>
    </div>

    <!-- Application Logic -->
    <script>
        // === Service Worker ချိတ်ဆက်ခြင်း ===
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW Registered'))
                .catch(err => console.log('SW Error', err));
            });
        }

        // Install Button Logic
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden'); 
            installBtn.classList.add('flex'); 
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); 
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('App Installed Successfully');
                }
                deferredPrompt = null;
                installBtn.classList.add('hidden');
                installBtn.classList.remove('flex');
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.classList.add('hidden');
            installBtn.classList.remove('flex');
        });

        // Application Logic
        const twodResultEl = document.getElementById('twod-result');
        const setIndexEl = document.getElementById('set-index');
        const setValueEl = document.getElementById('set-value');
        const timeTextEl = document.getElementById('current-time');
        const refreshIcon = document.getElementById('refresh-icon');
        const resultCheck = document.getElementById('result-check');
        const statusBadge = document.getElementById('market-status-badge');
        const statusDot = document.getElementById('market-status-dot');
        const statusText = document.getElementById('market-status-text');
        
        const morning2d = document.getElementById('morning-2d');
        const morningSet = document.getElementById('morning-set');
        const morningVal = document.getElementById('morning-val');
        const evening2d = document.getElementById('evening-2d');
        const eveningSet = document.getElementById('evening-set');
        const eveningVal = document.getElementById('evening-val');
        
        const mod930 = document.getElementById('mod-930');
        const int930 = document.getElementById('int-930');
        const tw930 = document.getElementById('tw-930');
        const mod1400 = document.getElementById('mod-1400');
        const int1400 = document.getElementById('int-1400');
        const tw1400 = document.getElementById('tw-1400');

        const API_URL = 'https://2d-live.activevpn2026.workers.dev/';
        let liveData = { twod: "--", set: "--", val: "--" };
        let fetchedApiData = null; 

        async function fetchRealMarketData() {
            try {
                refreshIcon.classList.add('fa-spin');
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                fetchedApiData = data; 
                let setStr = "", valStr = "";
                if (data.set && data.value) { setStr = String(data.set); valStr = String(data.value); } 
                else if (data.live && data.live.set) { setStr = String(data.live.set); valStr = String(data.live.value); }
                if (setStr && valStr) {
                    liveData.set = parseFloat(setStr.replace(/,/g, '')).toFixed(2);
                    liveData.val = parseFloat(valStr.replace(/,/g, '')).toFixed(2);
                    liveData.twod = liveData.set.split('.')[1].charAt(1) + liveData.val.split('.')[0].slice(-1);
                }
            } catch (error) {
                const now = new Date();
                const currentTimeInt = now.getHours() * 100 + now.getMinutes();
                if (currentTimeInt >= 1630) {
                    liveData.set = "1613.78"; liveData.val = "70640.38"; liveData.twod = "80";
                } else if (currentTimeInt >= 1201 && currentTimeInt < 1400) {
                    liveData.set = "1618.76"; liveData.val = "42740.15"; liveData.twod = "60";
                } else {
                    let simIndex = 1615.00 + (Math.random() - 0.5) * 5; let simValue = 70500.00 + (Math.random() - 0.5) * 100;
                    liveData.set = simIndex.toFixed(2); liveData.val = simValue.toFixed(2);
                    liveData.twod = liveData.set.split('.')[1].charAt(1) + liveData.val.split('.')[0].slice(-1);
                }
            } finally {
                setTimeout(() => refreshIcon.classList.remove('fa-spin'), 500);
            }
        }

        function updateCoreUI() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0'), month = String(now.getMonth() + 1).padStart(2, '0'), year = now.getFullYear();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0'), seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            let displayHours = hours % 12; displayHours = displayHours ? displayHours : 12; 
            timeTextEl.textContent = `${day}/${month}/${year} ${String(displayHours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;

            const currentTimeInt = hours * 100 + now.getMinutes();

            if (currentTimeInt >= 930) {
                mod930.textContent = (fetchedApiData && fetchedApiData.modern_930) || "35";
                int930.textContent = (fetchedApiData && fetchedApiData.internet_930) || "04";
                tw930.textContent = (fetchedApiData && fetchedApiData.tw_930) || "92";
            }
            if (currentTimeInt >= 1400) {
                mod1400.textContent = (fetchedApiData && fetchedApiData.modern_1400) || "98";
                int1400.textContent = (fetchedApiData && fetchedApiData.internet_1400) || "78";
                tw1400.textContent = (fetchedApiData && fetchedApiData.tw_1400) || "--";
            }

            const isNoonBreak = currentTimeInt >= 1200 && currentTimeInt < 1400;
            const isEveningClosed = currentTimeInt >= 1630 || currentTimeInt < 930;

            if (currentTimeInt >= 1201) {
                if (isNoonBreak && liveData.twod !== "--") {
                    morning2d.textContent = liveData.twod; morningSet.textContent = liveData.set; morningVal.textContent = liveData.val;
                } else if (morning2d.textContent === "--") {
                    morning2d.textContent = "60"; morningSet.textContent = "1618.76"; morningVal.textContent = "42740.15";
                }
            }
            if (currentTimeInt >= 1630 && liveData.twod !== "--") {
                evening2d.textContent = liveData.twod; eveningSet.textContent = liveData.set; eveningVal.textContent = liveData.val;
            }

            if (isEveningClosed && evening2d.textContent !== "--") {
                twodResultEl.textContent = evening2d.textContent; setIndexEl.textContent = eveningSet.textContent; setValueEl.textContent = eveningVal.textContent;
                resultCheck.classList.remove('hidden'); 
                statusText.textContent = "ဈေးကွက်ပိတ်သွားပါပြီ"; statusBadge.className = "flex items-center space-x-2 bg-red-500/20 text-red-400 px-3 py-1.5 rounded-full text-[11px] font-semibold border border-red-500/30 transition-colors"; statusDot.className = "w-2 h-2 bg-red-400 rounded-full";
            } 
            else if (isNoonBreak && morning2d.textContent !== "--") {
                twodResultEl.textContent = morning2d.textContent; setIndexEl.textContent = morningSet.textContent; setValueEl.textContent = morningVal.textContent;
                resultCheck.classList.remove('hidden');
                statusText.textContent = "ဈေးကွက်ပိတ်သွားပါပြီ"; statusBadge.className = "flex items-center space-x-2 bg-red-500/20 text-red-400 px-3 py-1.5 rounded-full text-[11px] font-semibold border border-red-500/30 transition-colors"; statusDot.className = "w-2 h-2 bg-red-400 rounded-full";
            } 
            else {
                twodResultEl.textContent = liveData.twod; setIndexEl.textContent = liveData.set; setValueEl.textContent = liveData.val;
                resultCheck.classList.add('hidden'); 
                statusText.textContent = "ဈေးကွက်ဖွင့်နေပါသည်"; statusBadge.className = "flex items-center space-x-2 bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-full text-[11px] font-semibold border border-emerald-500/30 transition-colors"; statusDot.className = "w-2 h-2 bg-emerald-400 rounded-full animate-pulse";
            }
        }

        setInterval(updateCoreUI, 1000); updateCoreUI();
        setInterval(fetchRealMarketData, 3000); fetchRealMarketData();
    </script>
</body>
</html>
