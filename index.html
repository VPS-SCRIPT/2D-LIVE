<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Myanmar 2D Live</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #020617;
            -webkit-tap-highlight-color: transparent;
        }

        .number-font {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .text-glow {
            text-shadow: 0 0 40px rgba(250, 204, 21, 0.5);
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-150%) skewX(-15deg);
            }
            100% {
                transform: translateX(150%) skewX(-15deg);
            }
        }
        .animate-shimmer {
            animation: shimmer 2.8s infinite;
        }

        @keyframes breathe {
            0%,
            100% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }
        .animate-breathe {
            animation: breathe 2s ease-in-out infinite;
        }

        ::-webkit-scrollbar {
            width: 0;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
</head>
<body>

    <div class="flex justify-center min-h-screen bg-slate-950 antialiased">
        <div class="w-full max-w-md bg-gradient-to-b from-slate-900 to-slate-950 overflow-hidden relative flex flex-col h-[100dvh] sm:h-[850px] shadow-[0_0_60px_rgba(0,0,0,0.7)] sm:rounded-[2.8rem] sm:border sm:border-slate-800 sm:my-6">

            <main class="flex-1 overflow-y-auto flex flex-col items-center pt-5 pb-24 px-5 space-y-4">

                <!-- Header -->
                <div class="flex justify-between items-center w-full mb-1">
                    <div class="flex items-center space-x-2">
                        <div class="relative flex items-center justify-center w-11 h-11 rounded-[0.8rem] bg-gradient-to-br from-yellow-400 to-orange-500 shadow-[0_0_18px_rgba(250,204,21,0.35)] border-[1.5px] border-yellow-200/70 overflow-hidden">
                            <div class="absolute inset-0 bg-white/40 w-1/2 animate-shimmer z-0"></div>
                            <span class="text-slate-900 font-black text-[1.2rem] tracking-tighter z-10 relative">2D</span>
                        </div>
                        <h1 class="text-2xl font-bold tracking-wide text-white drop-shadow-md ml-1">Live</h1>
                        <button id="install-btn" class="hidden animate-bounce text-[10px] bg-gradient-to-r from-yellow-400 to-yellow-500 text-slate-900 font-bold px-2.5 py-1 rounded-md shadow-[0_0_12px_rgba(250,204,21,0.5)] border border-yellow-300 ml-2 transition-all hover:scale-105 active:scale-95">
                            <i class="fa-solid fa-download mr-1"></i>Install
                        </button>
                    </div>
                    <div id="market-status-badge" class="flex items-center space-x-2 bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-full text-[11px] font-semibold border border-emerald-500/30 transition-colors">
                        <div id="market-status-dot" class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                        <span id="market-status-text">ဈေးကွက်ဖွင့်နေပါသည်</span>
                    </div>
                </div>

                <!-- Big Result Card -->
                <div class="glass-card w-full rounded-[2rem] relative shadow-lg mt-2 overflow-hidden">
                    <div class="absolute inset-0 pointer-events-none">
                        <div class="absolute -top-10 -right-10 w-44 h-44 bg-yellow-500/15 rounded-full blur-3xl"></div>
                        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
                    </div>
                    <div class="relative z-10 py-6 flex flex-col items-center justify-center">
                        <div class="flex items-center justify-center w-full min-h-[130px] mb-2">
                            <span class="text-[7.5rem] text-yellow-400 number-font text-glow leading-none flex items-center tracking-wider" id="twod-result">--</span>
                            <i id="result-check" class="fa-solid fa-circle-check text-emerald-500 text-4xl ml-4 hidden drop-shadow-md animate-breathe"></i>
                        </div>
                        <div class="flex items-center space-x-2 text-slate-300 text-[10px] font-medium bg-slate-950/60 px-4 py-2 rounded-full border border-white/5">
                            <i class="fa-solid fa-clock-rotate-left text-yellow-400" id="refresh-icon"></i>
                            <span id="current-time">--/--/---- --:--:-- --</span>
                        </div>
                    </div>
                </div>

                <!-- SET & VALUE -->
                <div class="flex w-full space-x-4">
                    <div class="flex-1 glass-card rounded-2xl p-4 flex flex-col items-center shadow-md relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-400 to-blue-600"></div>
                        <span class="text-slate-400 text-[10px] font-bold tracking-wider uppercase mb-1 mt-1">SET Index</span>
                        <span class="text-white text-xl font-bold number-font transition-all duration-300" id="set-index">----.--</span>
                    </div>
                    <div class="flex-1 glass-card rounded-2xl p-4 flex flex-col items-center shadow-md relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-400 to-purple-600"></div>
                        <span class="text-slate-400 text-[10px] font-bold tracking-wider uppercase mb-1 mt-1">Value</span>
                        <span class="text-white text-xl font-bold number-font transition-all duration-300" id="set-value">-----.--</span>
                    </div>
                </div>

                <!-- 12:01 PM & 4:30 PM Blocks -->
                <div class="flex w-full space-x-4">
                    <div class="flex-1 bg-gradient-to-b from-slate-800/80 to-slate-900/80 border border-slate-700/50 rounded-2xl overflow-hidden shadow-lg relative">
                        <div class="text-center py-2 bg-slate-800/90 border-b border-slate-700/50 text-[10px] font-semibold text-slate-300 flex items-center justify-center">
                            <i class="fa-regular fa-sun text-yellow-400 mr-1.5"></i> 12:01 PM
                        </div>
                        <div class="py-4 flex justify-center">
                            <span class="text-[2.2rem] text-white font-bold number-font" id="morning-2d">--</span>
                        </div>
                        <div class="flex text-slate-400 text-[9px] border-t border-slate-700/50 bg-black/40">
                            <div class="flex-1 text-center py-2 border-r border-slate-700/50" id="morning-set">--</div>
                            <div class="flex-1 text-center py-2" id="morning-val">--</div>
                        </div>
                    </div>
                    <div class="flex-1 bg-gradient-to-b from-slate-800/80 to-slate-900/80 border border-slate-700/50 rounded-2xl overflow-hidden shadow-lg relative">
                        <div class="text-center py-2 bg-slate-800/90 border-b border-slate-700/50 text-[10px] font-semibold text-slate-300 flex items-center justify-center">
                            <i class="fa-solid fa-moon text-indigo-400 mr-1.5"></i> 4:30 PM
                        </div>
                        <div class="py-4 flex justify-center">
                            <span class="text-[2.2rem] text-white font-bold number-font" id="evening-2d">--</span>
                        </div>
                        <div class="flex text-slate-400 text-[9px] border-t border-slate-700/50 bg-black/40">
                            <div class="flex-1 text-center py-2 border-r border-slate-700/50" id="evening-set">--</div>
                            <div class="flex-1 text-center py-2" id="evening-val">--</div>
                        </div>
                    </div>
                </div>

                <!-- History -->
                <div class="w-full mt-2">
                    <div class="flex justify-between px-4 pb-2 text-[11px] font-semibold text-slate-400">
                        <div class="w-20"></div>
                        <div class="w-14 text-center">Modern</div>
                        <div class="w-14 text-center">Internet</div>
                        <div class="w-14 text-center">TW</div>
                    </div>
                    <div class="glass-card rounded-2xl p-4 flex flex-col space-y-3 text-white font-medium text-sm">
                        <div class="flex justify-between items-center border-b border-white/5 pb-3">
                            <div class="w-20 text-slate-400 font-semibold text-[11px]"><i class="fa-regular fa-clock mr-1"></i> 9:30 AM</div>
                            <div class="w-14 text-center" id="mod-930">--</div>
                            <div class="w-14 text-center" id="int-930">--</div>
                            <div class="w-14 text-center text-yellow-400 font-bold" id="tw-930">--</div>
                        </div>
                        <div class="flex justify-between items-center pt-1">
                            <div class="w-20 text-slate-400 font-semibold text-[11px]"><i class="fa-regular fa-clock mr-1"></i> 2:00 PM</div>
                            <div class="w-14 text-center" id="mod-1400">--</div>
                            <div class="w-14 text-center" id="int-1400">--</div>
                            <div class="w-14 text-center text-yellow-400 font-bold" id="tw-1400">--</div>
                        </div>
                    </div>
                </div>

            </main>

            <!-- Bottom Nav -->
            <footer class="glass-card flex justify-around items-center px-4 py-2 pb-safe absolute bottom-0 w-full z-20 rounded-t-3xl border-t border-white/10 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] h-16">
                <button class="flex flex-col items-center text-yellow-400 group">
                    <div class="relative p-1.5 bg-yellow-400/10 rounded-xl transition-all">
                        <i class="fa-solid fa-bolt text-lg"></i>
                    </div>
                    <span class="text-[9px] font-bold mt-1">2D Live</span>
                </button>
                <button class="flex flex-col items-center text-slate-500 hover:text-white transition-colors">
                    <div class="relative p-1.5"><i class="fa-solid fa-cube text-lg"></i></div>
                    <span class="text-[9px] font-semibold mt-1">3D</span>
                </button>
                <button class="flex flex-col items-center text-slate-500 hover:text-white transition-colors">
                    <div class="relative p-1.5"><i class="fa-solid fa-gift text-lg"></i></div>
                    <span class="text-[9px] font-semibold mt-1">Gifts</span>
                </button>
                <button class="flex flex-col items-center text-slate-500 hover:text-white transition-colors">
                    <div class="relative p-1.5"><i class="fa-solid fa-chart-line text-lg"></i></div>
                    <span class="text-[9px] font-semibold mt-1">History</span>
                </button>
            </footer>

        </div>
    </div>

    <script>
        // ======================================================================
        // 1. MANIFEST – using data: URI (works in Chrome, WebAPK friendly)
        // ======================================================================
        (function injectManifest() {
            const manifest = {
                name: "Myanmar 2D Live",
                short_name: "2D Live",
                start_url: window.location.href.split('?')[0],
                scope: window.location.href.split('?')[0],
                display: "standalone",
                background_color: "#020617",
                theme_color: "#020617",
                orientation: "portrait",
                icons: [{
                    src: "https://ui-avatars.com/api/?name=2D&background=facc15&color=0f172a&size=192&font-size=0.5&bold=true",
                    sizes: "192x192",
                    type: "image/png",
                    purpose: "any maskable"
                }, {
                    src: "https://ui-avatars.com/api/?name=2D&background=facc15&color=0f172a&size=512&font-size=0.5&bold=true",
                    sizes: "512x512",
                    type: "image/png",
                    purpose: "any maskable"
                }]
            };
            const json = JSON.stringify(manifest);
            const encoded = encodeURIComponent(json);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = 'data:application/json;charset=utf-8,' + encoded;
            document.head.appendChild(link);
        })();

        // ======================================================================
        // 2. SERVICE WORKER – using Blob URL (fallback, but works on many devices)
        //    We also register a "dummy" worker so the PWA criteria are met.
        // ======================================================================
        (function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) return;

            // Minimal service worker that claims clients immediately
            const swCode = `
                self.addEventListener('install', e => { self.skipWaiting(); });
                self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        fetch(e.request).catch(() => new Response('Offline', { status: 503, statusText: 'Offline' }))
                    );
                });
            `;
            try {
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl, { scope: '/' })
                    .then(() => console.log('[SW] Registered'))
                    .catch(err => console.warn('[SW] Register failed:', err));
            } catch (_) { /* ignore */ }
        })();

        // ======================================================================
        // 3. INSTALL PROMPT
        // ======================================================================
        let deferredPrompt = null;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            const { outcome } = await deferredPrompt.prompt();
            if (outcome === 'accepted') {
                console.log('[PWA] Installed');
            }
            deferredPrompt = null;
            installBtn.classList.add('hidden');
        });

        window.addEventListener('appinstalled', () => {
            installBtn.classList.add('hidden');
        });

        // ======================================================================
        // 4. CORE APP LOGIC (unchanged from original, with minor tweaks)
        // ======================================================================
        const twodResultEl = document.getElementById('twod-result');
        const setIndexEl = document.getElementById('set-index');
        const setValueEl = document.getElementById('set-value');
        const timeTextEl = document.getElementById('current-time');
        const refreshIcon = document.getElementById('refresh-icon');
        const resultCheck = document.getElementById('result-check');

        const statusBadge = document.getElementById('market-status-badge');
        const statusDot = document.getElementById('market-status-dot');
        const statusText = document.getElementById('market-status-text');

        const morning2d = document.getElementById('morning-2d');
        const morningSet = document.getElementById('morning-set');
        const morningVal = document.getElementById('morning-val');
        const evening2d = document.getElementById('evening-2d');
        const eveningSet = document.getElementById('evening-set');
        const eveningVal = document.getElementById('evening-val');

        const mod930 = document.getElementById('mod-930');
        const int930 = document.getElementById('int-930');
        const tw930 = document.getElementById('tw-930');
        const mod1400 = document.getElementById('mod-1400');
        const int1400 = document.getElementById('int-1400');
        const tw1400 = document.getElementById('tw-1400');

        const API_URL = 'https://2d-live.activevpn2026.workers.dev/';

        let liveData = { twod: "--", set: "--", val: "--" };
        let fetchedApiData = null;

        function padZero(n) { return String(n).padStart(2, '0'); }

        async function fetchRealMarketData() {
            try {
                refreshIcon.classList.add('fa-spin');
                const resp = await fetch(API_URL);
                if (!resp.ok) throw new Error('API error');
                const data = await resp.json();
                fetchedApiData = data;

                let setStr = "",
                    valStr = "";
                if (data.set && data.value) { setStr = String(data.set);
                    valStr = String(data.value); } else if (data.live && data.live.set) { setStr = String(data.live.set);
                    valStr = String(data.live.value); }

                if (setStr && valStr) {
                    const setNum = parseFloat(setStr.replace(/,/g, ''));
                    const valNum = parseFloat(valStr.replace(/,/g, ''));
                    liveData.set = setNum.toFixed(2);
                    liveData.val = valNum.toFixed(2);
                    const dec = liveData.set.split('.')[1];
                    const first = dec.charAt(1);
                    const intPart = liveData.val.split('.')[0];
                    const second = intPart.slice(-1);
                    liveData.twod = first + second;
                }
            } catch (_) {
                const now = new Date();
                const t = now.getHours() * 100 + now.getMinutes();
                if (t >= 1630) { liveData.set = "1613.78";
                    liveData.val = "70640.38";
                    liveData.twod = "80"; } else if (t >= 1201 && t < 1400) { liveData.set = "1618.76";
                    liveData.val = "42740.15";
                    liveData.twod = "60"; } else {
                    const idx = (1615 + (Math.random() - 0.5) * 6).toFixed(2);
                    const val = (70500 + (Math.random() - 0.5) * 120).toFixed(2);
                    liveData.set = idx;
                    liveData.val = val;
                    liveData.twod = idx.split('.')[1].charAt(1) + val.split('.')[0].slice(-1);
                }
            } finally {
                setTimeout(() => refreshIcon.classList.remove('fa-spin'), 400);
            }
        }

        function updateCoreUI() {
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            let h = now.getHours();
            const min = String(now.getMinutes()).padStart(2, '0');
            const sec = String(now.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            let dh = h % 12;
            dh = dh ? dh : 12;
            timeTextEl.textContent = `${d}/${m}/${y} ${String(dh).padStart(2, '0')}:${min}:${sec} ${ampm}`;

            const t = now.getHours() * 100 + now.getMinutes();

            // History
            if (t >= 930) {
                mod930.textContent = (fetchedApiData && fetchedApiData.modern_930) || "35";
                int930.textContent = (fetchedApiData && fetchedApiData.internet_930) || "04";
                tw930.textContent = (fetchedApiData && fetchedApiData.tw_930) || "92";
            }
            if (t >= 1400) {
                mod1400.textContent = (fetchedApiData && fetchedApiData.modern_1400) || "98";
                int1400.textContent = (fetchedApiData && fetchedApiData.internet_1400) || "78";
                tw1400.textContent = (fetchedApiData && fetchedApiData.tw_1400) || "--";
            }

            const isNoonBreak = t >= 1200 && t < 1400;
            const isEveningClosed = t >= 1630 || t < 930;

            if (t >= 1201) {
                if (isNoonBreak && liveData.twod !== "--") {
                    morning2d.textContent = liveData.twod;
                    morningSet.textContent = liveData.set;
                    morningVal.textContent = liveData.val;
                } else if (morning2d.textContent === "--") {
                    morning2d.textContent = "60";
                    morningSet.textContent = "1618.76";
                    morningVal.textContent = "42740.15";
                }
            }

            if (t >= 1630) {
                if (liveData.twod !== "--") {
                    evening2d.textContent = liveData.twod;
                    eveningSet.textContent = liveData.set;
                    eveningVal.textContent = liveData.val;
                }
            }

            // Big result & market status
            if (isEveningClosed && evening2d.textContent !== "--") {
                twodResultEl.textContent = evening2d.textContent;
                setIndexEl.textContent = eveningSet.textContent;
                setValueEl.textContent = eveningVal.textContent;
                resultCheck.classList.remove('hidden');
                statusText.textContent = "ဈေးကွက်ပိတ်သွားပါပြီ";
                statusBadge.className =
                    "flex items-center space-x-2 bg-red-500/20 text-red-400 px-3 py-1.5 rounded-full text-[11px] font-semibold border border-red-500/30 transition-colors";
                statusDot.className = "w-2 h-2 bg-red-400 rounded-full";
            } else if (isNoonBreak && morning2d.textContent !== "--") {
                twodResultEl.textContent = morning2d.textContent;
                setIndexEl.textContent = morningSet.textContent;
                setValueEl.textContent = morningVal.textContent;
                resultCheck.classList.remove('hidden');
                statusText.textContent = "ဈေးကွက်ပိတ်သွားပါပြီ";
                statusBadge.className =
                    "flex items-center space-x-2 bg-red-500/20 text-red-400 px-3 py-1.5 rounded-full text-[11px] font-semibold border border-red-500/30 transition-colors";
                statusDot.className = "w-2 h-2 bg-red-400 rounded-full";
            } else {
                twodResultEl.textContent = liveData.twod;
                setIndexEl.textContent = liveData.set;
                setValueEl.textContent = liveData.val;
                resultCheck.classList.add('hidden');
                statusText.textContent = "ဈေးကွက်ဖွင့်နေပါသည်";
                statusBadge.className =
                    "flex items-center space-x-2 bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-full text-[11px] font-semibold border border-emerald-500/30 transition-colors";
                statusDot.className = "w-2 h-2 bg-emerald-400 rounded-full animate-pulse";
            }
        }

        // Start loops
        setInterval(updateCoreUI, 1000);
        updateCoreUI();

        setInterval(fetchRealMarketData, 3000);
        fetchRealMarketData();

        // ======================================================================
        // 5. EXTRA: force install banner to appear quickly
        // ======================================================================
        // The beforeinstallprompt event will fire naturally once the PWA criteria
        // are met. We just need to ensure the manifest and SW are registered.
        // The install button will appear when the event fires.
        console.log('[PWA] Ready – manifest + SW injected');
    </script>

</body>
</html>
